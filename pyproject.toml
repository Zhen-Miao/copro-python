[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycopro"
version = "0.2.0"
description = "Spatial Kernel Restricted CCA for spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Zhen Miao" },
]
keywords = [
    "spatial transcriptomics",
    "CCA",
    "spatial omics",
    "single cell",
    "bioinformatics",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyarrow>=12",
    "anndata>=0.10",
]

[project.optional-dependencies]
stats = ["statsmodels>=0.14"]
plot = ["matplotlib>=3.7"]
data = ["rdata>=0.11"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "rdata>=0.11",
]

[project.urls]
Homepage = "https://github.com/Zhen-Miao/copro-python"
Repository = "https://github.com/Zhen-Miao/copro-python"
"Bug Tracker" = "https://github.com/Zhen-Miao/copro-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["copro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
